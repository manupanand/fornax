[package]
name = "fornax-server"
description = "The fornax binary: server, admin CLI, CI runner agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "fornax"
path = "src/main.rs"

[dependencies]
fornax-agent.workspace = true
fornax-api.workspace = true
fornax-ci.workspace = true
fornax-core.workspace = true
fornax-db.workspace = true
fornax-git.workspace = true
fornax-runner.workspace = true
fornax-ssh.workspace = true
anyhow.workspace = true
# http2: gRPC (runner protocol) shares the HTTP port via h2c.
axum = { workspace = true, features = ["http2"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
fornax-proto.workspace = true
reqwest.workspace = true
tempfile.workspace = true
tonic.workspace = true

[lints]
workspace = true
