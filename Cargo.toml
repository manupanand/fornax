[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/manupanand/fornax"
rust-version = "1.88"

[workspace.dependencies]
fornax-core = { path = "crates/fornax-core" }
fornax-db = { path = "crates/fornax-db" }
fornax-git = { path = "crates/fornax-git" }
fornax-api = { path = "crates/fornax-api" }
fornax-ssh = { path = "crates/fornax-ssh" }
fornax-spec = { path = "crates/fornax-spec" }
fornax-proto = { path = "crates/fornax-proto" }
fornax-agent = { path = "crates/fornax-agent" }
fornax-ci = { path = "crates/fornax-ci" }
fornax-runner = { path = "crates/fornax-runner" }

anyhow = "1"
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.2"
hex = "0.4"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = { version = "8", features = ["interpolate-folder-path", "mime-guess"] }
saphyr-parser = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

# Runner protocol (C-005) and agent (C-006)
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }
proptest = "1"
prost = "0.14"
protox = "0.10"
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

# Smaller debug info keeps WSL/target disk use down (D: is tight; D-043).
[profile.dev]
debug = "line-tables-only"
